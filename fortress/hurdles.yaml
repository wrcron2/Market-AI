# Validation fortress — pre-registered hurdles (Trading System v2.4 plan §4.2).
#
# One file holds every sleeve's thresholds. Printed at the top of every
# fortress report (fortress/run.py). Changes are allowed only by a
# pre-registration amendment (preregistration_template.md) filed BEFORE the
# affected run — never after. CI machinery is pinned under `statistics`.
version: "1.0"
pinned: 2026-08-03

statistics:
  ci_method: circular block bootstrap   # over the per-rotation net series
  block_length: 3                       # rotations; holdings overlap adjacent rotations
  resamples: 20000
  seed: 42
  level: 0.95

sleeves:
  m1:
    description: cross-sectional 90-trading-day momentum rotation, S&P 100 point-in-time universe
    pinned_cadence: monthly             # §8 pin from the fortress verdict — sleeve_specs/m1.md
    price_band_usd: [20.0, 150.0]
    rules:
      ci95_lb_net_annual_gt: 0.0        # Rule A: bootstrap 95% CI lower bound above zero
      net_annual_gt_x_friction: 2.0     # Rule B: margin for cost-model error
  m2:
    description: swing sleeve; hold window is a pinned bounded range, both endpoints evaluated at its gate
    hold_window_trading_days: [3, 10]   # §8 bounded range — sleeve_specs/m2.md
    price_band_usd: [20.0, 150.0]
    rules:
      ci95_lb_net_annual_gt: 0.0
      net_annual_gt_x_friction: 2.0
  d1:
    description: intraday opening-range-breakout sleeve
    status: parked                      # plan §7 default (option B) unless the G5 gate re-cuts it
    price_band_usd_if_recut: [80.0, null]  # >=$80 liquid names only (§7 option A / §8)
    rules:
      gross_per_trade_bps_gt: 10.0      # §4 hurdle; a re-cut D1 restates ~6 bps (§7 option A)
