server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required: with a literal hostname in proxy_pass,
    # nginx resolves "backend" once at startup and caches that IP for the life
    # of the process. On 2026-07-30 the backend had been recreated by a deploy
    # and moved 172.18.0.2 -> 172.18.0.4, so every /api and /ws request 502'd
    # for 36h while the backend itself was healthy. Using a variable in
    # proxy_pass forces re-resolution per request, so a recreated backend is
    # picked up automatically.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin http://backend:8080;

    location /api/ask {
        proxy_pass $backend_origin$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location /api/ {
        proxy_pass $backend_origin$request_uri;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
