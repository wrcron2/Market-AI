services:
  # ─── Go Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: market-ai-backend:${APP_VERSION:-latest}
    ports:
      - "${GO_SERVER_PORT:-8080}:8080"   # REST / HTTP + WebSocket (/ws)
      - "${GO_GRPC_PORT:-50051}:50051"   # gRPC (brain → backend)
    env_file: .env
    volumes:
      - ./infra/db:/app/db               # persist SQLite on host
      - ./infra/versions:/app/versions   # version history + switch requests
      - ./agents:/app/agents             # pipeline agent prompts
      - ./logs:/app/logs                 # pipeline agent logs
      - ./reports:/app/status-reports:ro # Chief PM markdown audit reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─── Python AI Brain ─────────────────────────────────────────────────────────
  brain:
    build:
      context: ./ai-brain
      dockerfile: Dockerfile
    image: market-ai-brain:${APP_VERSION:-latest}
    env_file: .env
    volumes:
      - ./logs:/app/logs             # heartbeat file for host watchdog
    # NOTE: Ollama must be running on the host at OLLAMA_HOST
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,time; p='/app/logs/brain_heartbeat.json'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<120 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: market-ai-frontend:${APP_VERSION:-latest}
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: marketflow-net
